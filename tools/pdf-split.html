<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Split Tool | Azhar Labs</title>

<link rel="stylesheet" href="pdf-split.css">
</head>

<body>

<div class="container">

<h1>✂️ PDF Split Tool</h1>

<p>Extract any page from your PDF in seconds.</p>

<input type="file" id="pdfInput" accept=".pdf" hidden>

<label for="pdfInput" class="upload-btn">
📄 Select PDF
</label>

<p id="fileInfo">No PDF Selected</p>

<input
type="number"
id="pageNumber"
placeholder="Enter Page Number (Example: 3)"
min="1"
>

<button onclick="splitPDF()">
✂️ Split PDF
</button>

<p id="status"></p>

<a id="downloadBtn" style="display:none;">
📥 Download Split PDF
</a>

<br><br>

<a href="../index.html" class="back">
⬅ Back to Home
</a>

</div>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="pdf-split.js"></script>

</body>
</html>
