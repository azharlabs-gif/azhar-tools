<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Generator | Azhar Labs</title>

<meta name="description" content="Generate strong and secure passwords instantly with Azhar Labs Password Generator.">

<link rel="stylesheet" href="password-generator.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="card">

<div class="tool-icon">
<i class="fa-solid fa-shield-halved"></i>
</div>

<h1>Password Generator</h1>

<p class="subtitle">
Generate strong, secure and random passwords instantly.
</p>

<input
type="text"
id="password"
placeholder="Your password will appear here..."
readonly
>

<div class="length-box">

<span>Password Length</span>

<span id="lengthValue">12</span>

</div>

<input
type="range"
id="length"
min="8"
max="32"
value="12"
>

<div class="option">
<label for="upper">Uppercase Letters</label>
<input type="checkbox" id="upper" checked>
</div>

<div class="option">
<label for="lower">Lowercase Letters</label>
<input type="checkbox" id="lower" checked>
</div>

<div class="option">
<label for="numbers">Numbers</label>
<input type="checkbox" id="numbers" checked>
</div>

<div class="option">
<label for="symbols">Symbols</label>
<input type="checkbox" id="symbols" checked>
</div>

<button id="generateBtn" class="btn">
<i class="fa-solid fa-bolt"></i>
Generate Password
</button>

<button id="copyBtn" class="btn">
<i class="fa-solid fa-copy"></i>
Copy Password
</button>

<a href="../index.html" class="back-home">
<i class="fa-solid fa-arrow-left"></i>
Back To Home
</a>

</div>

</div>

<script src="password-generator.js"></script>

</body>
</html>
