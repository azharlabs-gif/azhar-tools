<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator | Azhar Labs</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;
padding:20px;
}

.container{
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
padding:30px;
border-radius:20px;
width:100%;
max-width:420px;
}

h1{
text-align:center;
margin-bottom:20px;
}

input[type=text]{
width:100%;
padding:15px;
font-size:18px;
border:none;
border-radius:10px;
margin-bottom:20px;
}

.option{
display:flex;
justify-content:space-between;
margin:12px 0;
}

input[type=range]{
width:100%;
margin:15px 0;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:white;
text-decoration:none;
}
</style>

</head>
<body>

<div class="container">

<h1>🔐 Password Generator</h1>

<input type="text" id="password" readonly>

<label>Password Length:
<span id="lengthValue">12</span>
</label>

<input type="range" id="length" min="8" max="32" value="12">

<div class="option">
<label>Uppercase</label>
<input type="checkbox" id="upper" checked>
</div>

<div class="option">
<label>Lowercase</label>
<input type="checkbox" id="lower" checked>
</div>

<div class="option">
<label>Numbers</label>
<input type="checkbox" id="numbers" checked>
</div>

<div class="option">
<label>Symbols</label>
<input type="checkbox" id="symbols" checked>
</div>

<button onclick="generatePassword()">
Generate Password
</button>

<button onclick="copyPassword()">
Copy Password
</button>

<a class="back" href="../index.html">
⬅ Back to Home
</a>

</div>

<script>
const password=document.getElementById("password");
const length=document.getElementById("length");
const lengthValue=document.getElementById("lengthValue");

length.oninput=function(){
lengthValue.innerText=this.value;
}

function generatePassword(){

let chars="";

if(document.getElementById("upper").checked)
chars+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

if(document.getElementById("lower").checked)
chars+="abcdefghijklmnopqrstuvwxyz";

if(document.getElementById("numbers").checked)
chars+="0123456789";

if(document.getElementById("symbols").checked)
chars+="!@#$%^&*()_+-={}[]<>?/";

if(chars===""){
alert("Select at least one option");
return;
}

let pass="";

for(let i=0;i<length.value;i++){
pass+=chars.charAt(Math.floor(Math.random()*chars.length));
}

password.value=pass;

}

function copyPassword(){

navigator.clipboard.writeText(password.value);

alert("Password Copied!");

}

generatePassword();
</script>

</body>
</html>
