<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator | Azhar Labs</title>

    <link rel="stylesheet" href="password-generator.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="card">

        <div class="icon">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h1>Password Generator</h1>

        <input type="text" id="password" readonly>

        <div class="length-box">
            <span>Password Length</span>
            <span id="lengthValue">12</span>
        </div>

        <input
            type="range"
            id="length"
            min="8"
            max="32"
            value="12"
        >

        <div class="option">
            <label>Uppercase</label>
            <input type="checkbox" id="upper" checked>
        </div>

        <div class="option">
            <label>Lowercase</label>
            <input type="checkbox" id="lower" checked>
        </div>

        <div class="option">
            <label>Numbers</label>
            <input type="checkbox" id="numbers" checked>
        </div>

        <div class="option">
            <label>Symbols</label>
            <input type="checkbox" id="symbols" checked>
        </div>

        <button id="generateBtn">
            <i class="fa-solid fa-bolt"></i>
            Generate Password
        </button>

        <button id="copyBtn">
            <i class="fa-solid fa-copy"></i>
            Copy Password
        </button>

        <a href="../index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>

    </div>

</div>

<script src="password-generator.js"></script>

</body>
</html>
