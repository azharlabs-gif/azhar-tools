<body>

<div class="container">

<h1>📄 PDF to JPG</h1>

<p>
Convert PDF pages into high-quality JPG images instantly.
</p>

<input
type="file"
id="pdfInput"
accept=".pdf"
hidden
>

<label for="pdfInput" class="upload-btn">
📤 Select PDF
</label>

<p id="fileInfo">

</p>

</button>

<a
id="downloadBtn"
style="display:none;"
>
📥 Download JPG Images
</a>
