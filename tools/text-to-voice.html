<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text-to-Voice Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glass-card">
        <h2>AI Text-to-Voice</h2>
        <p>Apna text niche likhein aur AI voice mein sunnein.</p>

        <textarea id="text-input" placeholder="Yahan apna text likhein... (e.g., Hello, welcome to my GitHub tool!)"></textarea>

        <div class="control-group">
            <label for="voice-select">Choose Voice</label>
            <select id="voice-select">
                <option value="">Loading voices...</option>
            </select>
        </div>

        <div class="sliders">
            <div class="control-group">
                <label>Speed: <span id="speed-label">1x</span></label>
                <input type="range" id="speed-rate" min="0.5" max="2" value="1" step="0.1">
            </div>
            <div class="control-group">
                <label>Pitch: <span id="pitch-label">1</span></label>
                <input type="range" id="pitch-rate" min="0.5" max="2" value="1" step="0.1">
            </div>
        </div>

        <div class="button-group">
            <button id="speak-btn" class="btn btn-primary">🔊 Speak</button>
            <button id="pause-btn" class="btn btn-secondary">⏸ Pause</button>
            <button id="stop-btn" class="btn btn-danger">🛑 Stop</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
