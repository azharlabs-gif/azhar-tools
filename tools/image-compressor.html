<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compressor | Azhar Labs</title>

<link rel="stylesheet" href="image-compressor.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-P7748TVE22"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());

gtag('config', 'G-P7748TVE22');
</script>

</head>

<body>

<div class="container">

<h1><i class="fa-solid fa-image"></i> Image Compressor</h1>

<p>Upload an image and compress it instantly.</p>

<input type="file" id="imageInput" accept="image/*" hidden>

<label for="imageInput" class="upload-btn">
<i class="fa-solid fa-upload"></i> Select Image
</label>

<p id="fileName"></p>

<br><br>

<img id="preview" style="max-width:100%; display:none; border-radius:12px;">

<br><br>

<label for="quality">Compression Level</label>

<select id="quality">
    <option value="0.9">🟢 High Quality</option>
    <option value="0.7" selected>🔵 Balanced</option>
    <option value="0.5">🟠 Small Size</option>
    <option value="0.3">🔴 Maximum Compression</option>
</select>

<br><br>

<button onclick="compressImage()">
<i class="fa-solid fa-compress"></i> Compress Image
</button>

<br><br>

<p id="sizeInfo"></p>

<a id="downloadBtn" style="display:none;">
<i class="fa-solid fa-download"></i> Download Compressed Image
</a>

<br><br>

<a href="../index.html" class="back">
<i class="fa-solid fa-arrow-left"></i> Back to Home
</a>

</div>

<script src="image-compressor.js"></script>

</body>
</html>
