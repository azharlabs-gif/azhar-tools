<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Code Generator | Azhar Labs</title>

<meta name="description" content="Generate high-quality QR codes instantly for URLs, text and more with Azhar Labs.">

<link rel="stylesheet" href="qr-generator.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>



</head>

<body>

<div class="container">

<div class="card">

<div class="tool-icon">
<i class="fa-solid fa-qrcode"></i>
</div>

<h1>QR Code Generator</h1>

<p class="subtitle">
Generate beautiful, high-quality QR codes for websites, text and more.
</p>

<input
type="text"
id="qrText"
placeholder="Enter URL or text..."
autocomplete="off"
>

<button id="generateBtn" class="btn">
<i class="fa-solid fa-bolt"></i>
Generate QR Code
</button>

<div class="qr-box">

<div id="qrcode"></div>

</div>

<button id="downloadBtn" class="btn secondary" style="display:none;">
<i class="fa-solid fa-download"></i>
Download QR Code
</button>

<a href="../index.html" class="back-home">
<i class="fa-solid fa-arrow-left"></i>
Back To Home
</a>

</div>

</div>

<script src="qr-generator.js"></script>

</body>
</html>
