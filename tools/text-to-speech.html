<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to Speech | Azhar Labs</title>

<link rel="stylesheet" href="text-to-speech.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="container">

<div class="top">

<h1><i class="fa-solid fa-volume-high"></i> Text to Speech</h1>

<p>Convert your text into natural speech instantly.</p>

</div>

<div class="box">

<textarea id="text" placeholder="Type or paste your text here..."></textarea>

<div class="options">

<div class="option">
<label>Voice</label>
<select id="voiceSelect"></select>
</div>

<div class="option">
<label>Speed</label>
<input type="range" id="speed" min="0.5" max="2" value="1" step="0.1">
</div>

</div>

<div class="buttons">

<button class="speak" onclick="speak()">
<i class="fa-solid fa-play"></i>
Speak
</button>

<button class="stop" onclick="stopSpeech()">
<i class="fa-solid fa-stop"></i>
Stop
</button>

</div>

</div>

</div>

<script src="text-to-speech.js"></script>

</body>
</html>
