<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Text to Speech | Azhar Labs</title>

<link rel="stylesheet" href="text-to-speech.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>

<div class="container">

<div class="card">

<h1>
<i class="fa-solid fa-volume-high"></i>
Text to Speech
</h1>

<p>
Convert text into realistic AI speech using ElevenLabs.
</p>

<textarea
id="text"
placeholder="Type or paste your text here..."
></textarea>

<div class="actions">

<button id="generateBtn">
<i class="fa-solid fa-wand-magic-sparkles"></i>
Generate Voice
</button>

<button id="clearBtn">
<i class="fa-solid fa-trash"></i>
Clear
</button>

</div>

<div id="result" style="display:none;">

<audio id="audioPlayer" controls></audio>

<a id="downloadBtn" download="speech.mp3">
<button>
<i class="fa-solid fa-download"></i>
Download MP3
</button>
</a>

</div>

</div>

</div>

<script src="text-to-speech.js"></script>

</body>
</html>
