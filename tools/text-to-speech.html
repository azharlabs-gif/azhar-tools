<!DOCTYPE html>
<html>
<head>
    <title>Text To Voice | Azhar Labs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🎙️ Text To Voice</h1>
    <p>Write text and convert it into voice</p>

    <textarea id="text" placeholder="Type your text here..."></textarea>

    <div class="controls">
        <select id="voiceSelect"></select>

        <input type="range" id="speed" min="0.5" max="2" value="1" step="0.1">
    </div>

    <button onclick="speak()">🔊 Speak</button>
    <button onclick="stopSpeech()">⛔ Stop</button>
</div>

<script src="script.js"></script>
</body>
</html>
