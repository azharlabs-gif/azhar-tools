<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Image Generator | Azhar Labs</title>

<meta name="description" content="Generate AI Images for free using Azhar Labs">

<link rel="stylesheet" href="prompt-to-image.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">



</head>

<body>

<div class="bg-glow glow-1"></div>
<div class="bg-glow glow-2"></div>

<div class="container">

<div class="card">

<div class="badge">
<i class="fa-solid fa-sparkles"></i>
<span>AI Powered</span>
</div>

<h1>
🎨 AI Image Generator
</h1>

<p class="subtitle">
Create stunning AI images from simple text prompts in just a few seconds.
</p>

<div class="input-section">

<label for="prompt">
Describe your image
</label>

<textarea
id="prompt"
maxlength="1000"
placeholder="Example: A futuristic cyberpunk city at sunset, ultra realistic, cinematic lighting, 8K"></textarea>

<div class="counter">
<span id="charCount">0 Characters</span>
</div>

</div>

<div class="settings">

<div class="setting">

<label for="size">
Image Size
</label>

<select id="size">

<option value="1024x1024">
Square (1024 × 1024)
</option>

<option value="1024x1536">
Portrait
</option>

<option value="1536x1024">
Landscape
</option>

</select>

</div>

</div>

<div class="examples">

<button type="button" class="example">
🌌 Space Planet
</button>

<button type="button" class="example">
🦁 Realistic Lion
</button>

<button type="button" class="example">
🏯 Japanese Temple
</button>

<button type="button" class="example">
🤖 Futuristic Robot
</button>

<button type="button" class="example">
🐉 Dragon
</button>

<button type="button" class="example">
🏝️ Tropical Island
</button>

</div>

<button id="generateBtn" type="button">

<i class="fa-solid fa-wand-magic-sparkles"></i>

<span>Generate Image</span>

</button>
<div id="loader" class="loader">

<div class="spinner"></div>

<h3>Generating Your AI Image...</h3>

<p>Please wait a few seconds.</p>

</div>

<div class="preview-card">

<div id="placeholder" class="placeholder">

<i class="fa-solid fa-image"></i>

<h3>Your AI Image</h3>

<p>Your generated image will appear here.</p>

</div>

<img
id="resultImage"
src=""
alt="Generated AI Image">

</div>

<div class="actions">

<a
id="downloadBtn"
href="#"
download="azharlabs-ai-image.png">

<i class="fa-solid fa-download"></i>

<span>Download Image</span>

</a>

<button
id="newBtn"
type="button">

<i class="fa-solid fa-rotate-right"></i>

<span>Generate Another</span>

</button>

</div>

<a
href="../index.html"
class="back-home">

<i class="fa-solid fa-arrow-left"></i>

<span>Back to Home</span>

</a>

</div>

</div>

<script src="prompt-to-image.js"></script>

</body>
</html>
