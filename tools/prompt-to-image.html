<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Image Generator | Azhar Labs</title>

  <meta name="description"
    content="Generate stunning AI images from text prompts for free with Azhar Labs.">

  <link rel="stylesheet" href="prompt-to-image.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P7748TVE22"></script>

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-P7748TVE22');
  </script>

</head>

<body>

<div class="container">

<div class="card">

<div class="badge">
<i class="fa-solid fa-wand-magic-sparkles"></i>
AI Powered
</div>

<h1>
🎨 AI Image Generator
</h1>

<p class="subtitle">
Create beautiful AI images from your imagination in seconds.
</p>

<div class="input-box">

<label>Describe your image</label>

<textarea
id="prompt"
placeholder="Example: A futuristic city at sunset with flying cars, ultra realistic, 8K">
</textarea>

<div class="counter">
<span id="charCount">0 Characters</span>
</div>

</div>

<div class="options">

<div class="field">

<label>Image Size</label>

<select id="size">

<option value="1024x1024">
Square (1024×1024)
</option>

<option value="1024x1536">
Portrait
</option>

<option value="1536x1024">
Landscape
</option>

</select>

</div>

</div>

<button id="generateBtn">

<i class="fa-solid fa-image"></i>

Generate Image

</button>

<div class="preview">

<img
id="resultImage"
src=""
alt="Generated Image"
style="display:none;">

<div id="placeholder">

<i class="fa-regular fa-image"></i>

<p>
Your generated image will appear here.
</p>

</div>

</div>

<div class="actions">

<a
id="downloadBtn"
download="azharlabs-ai-image.png">

<i class="fa-solid fa-download"></i>

Download Image

</a>

</div>

<a
class="back-home"
href="../index.html">

<i class="fa-solid fa-arrow-left"></i>

Back to Home

</a>

</div>

</div>

<script src="prompt-to-image.js"></script>

</body>
</html>
