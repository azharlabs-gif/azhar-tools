<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Base64 Encoder & Decoder | Azhar Labs</title>

<link rel="stylesheet" href="base64-encoder-decoder.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">



</head>

<body>

<div class="container">

<h1>

<i class="fas fa-exchange-alt"></i>

Base64 Encoder & Decoder

</h1>

<p class="subtitle">

Encode and decode Base64 text instantly with a fast, secure and browser-based tool.

</p>
  <div class="card">

    <h2>
        <i class="fas fa-keyboard"></i>
        Input
    </h2>

    <textarea
        id="inputText"
        placeholder="Type or paste your text or Base64 here..."
        spellcheck="false"
    ></textarea>

    <div class="char-counter">
        Characters:
        <span id="charCount">0</span>
    </div>

    <div class="button-group">

        <button id="encodeBtn">
            <i class="fas fa-lock"></i>
            Encode
        </button>

        <button id="decodeBtn">
            <i class="fas fa-unlock"></i>
            Decode
        </button>

        <button id="swapBtn">
            <i class="fas fa-right-left"></i>
            Swap
        </button>

    </div>

  </div>
  <div class="card">

    <h2>
        <i class="fas fa-file-export"></i>
        Output
    </h2>

    <textarea
        id="outputText"
        placeholder="Your encoded or decoded result will appear here..."
        readonly
        spellcheck="false"
    ></textarea>

    <div id="statusMessage"></div>

    <div class="button-group">

        <button id="copyBtn">
            <i class="fas fa-copy"></i>
            Copy
        </button>

        <button id="downloadBtn">
            <i class="fas fa-download"></i>
            Download
        </button>

        <button id="clearBtn">
            <i class="fas fa-trash"></i>
            Clear
        </button>

    </div>

  </div>
  <a href="../index.html" class="back-btn">

    <i class="fas fa-arrow-left"></i>

    Back to Home

</a>

</div>

<script src="base64-encoder-decoder.js"></script>

</body>

</html>
